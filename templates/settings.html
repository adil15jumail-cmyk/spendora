{% extends "base.html" %}{% block title %}Settings — Spendora{% endblock %}{% block content %}<header class="head"><div><small>PREFERENCES</small><h1>Settings</h1></div></header><section class="panel"><form method="post" class="form"><label>Currency<select name="currency">{% for c in ['INR','USD','EUR','GBP','JPY'] %}<option {{'selected' if current_user.currency==c}}>{{c}}</option>{% endfor %}</select></label><label>Timezone<input name="timezone" value="{{current_user.timezone}}"></label><button class="btn">Save settings</button></form><hr><h2>Push notifications</h2><p class="muted">Requires HTTPS, browser permission, and VAPID keys configured on the server.</p><button class="btn" onclick="enablePush()">Enable push notifications</button><p id="pushStatus" class="muted"></p></section>{% endblock %}{% block scripts %}<script>document.querySelector('button[onclick="enablePush()"]').onclick=enablePush;</script>{% endblock %}
